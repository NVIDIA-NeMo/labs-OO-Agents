name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync --all-extras --no-extra sandbox
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: SPDX license headers
        run: uv run python scripts/check_license_headers.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync --all-extras --no-extra sandbox
      # tests/tools/test_shell_tools_modern.py skipif-drops 145 tests when `rg`
      # is not on PATH. ubuntu-latest does not ship ripgrep, so without this
      # step those tests silently skip and the job passes vacuously. See #65.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Unit tests (no live API calls)
        run: uv run pytest -q -m "not integration and not stress and not sandbox"
      # Sandbox containment tests fork a real worker to exercise the OS-level
      # sandbox (Landlock, seccomp, RLIMIT, cell timeouts, broker-pipe
      # boundary). They need no credentials and skipif-degrade on kernels
      # without the relevant capabilities, so ubuntu-latest runs them for
      # real. Kept out of the unit-test step because forking a worker is
      # heavier than a unit test. See #78.
      - name: Sandbox containment tests
        run: uv run pytest -q -m sandbox

  # Every other job here is ubuntu-latest, so a module-level POSIX-only import
  # (fcntl, resource, signal.SIGUSR2) reaches PyPI with nothing failing first.
  # That is not hypothetical: 0.0.8 shipped unimportable on native Windows.
  # See #84, #85, #92, #95.
  #
  # Deliberately import-only. The full suite cannot run on these hosts —
  # BashSession needs bash and subprocess pass_fds, and the Landlock/seccomp/
  # RLIMIT sandbox is Linux-only by design — but importability is the whole
  # bug class that has actually escaped, and it costs seconds to gate.
  #
  # The macOS leg is future-proofing, not a detector of anything on main today:
  # the import closure of `import nooa` is 133 modules, and the only
  # platform-specific things in it are fcntl (#84) and signal.SIGUSR2 (#85),
  # both of which macOS has. sandbox/guards.py — the `import resource` from
  # #92 — is not in that closure at all; it loads on SandboxedExecutor
  # construction. macOS earns its place by catching the other direction (a
  # Linux-only /proc or landlock assumption reaching module scope) and because
  # it is the platform contributors are most likely on after Linux.
  import-smoke:
    strategy:
      # A Windows-only break must not cancel the macOS leg before it reports.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          # litellm publishes manylinux wheels only, so both of these legs
          # resolve to its sdist — a pyo3/maturin Rust project that maturin
          # compiles after silently bootstrapping a toolchain. Measured cold on
          # an M1: 39s wall, 145s CPU, producing a 5.7 MB native extension.
          # Without a cache every run pays that on the slowest runners we have.
          enable-cache: true
      # All four distributions the build job produces, not just nooa: each is
      # published separately, so each can independently become unimportable.
      # --no-project installs them as a consumer would rather than syncing the
      # dev environment, which is what the failing user report exercised.
      - name: Import every published distribution
        run: >
          uv run --no-project
          --with . --with ./packages/nooa-cli
          --with ./packages/nooa-memory --with ./packages/nooa-bench
          python -c "import nooa, nooa_cli, nooa_memory, nooa_bench; print(nooa.__version__)"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags needed for uv-dynamic-versioning
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Mirrors the publish workflow's build exactly (--no-sources included) so
      # this job stays a real canary for release-build breakage.
      - name: Build all packages
        run: |
          rm -rf dist
          for pkg in nooa nooa-cli nooa-memory nooa-bench; do
            uv build --no-sources --package "$pkg" --out-dir dist
          done
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Proves the committed viewer bundle is exactly what building the committed
  # source produces. dist/ is 424 KB of minified JS that no reviewer can read,
  # so without this the bundle is an unreviewable trust input that any
  # contributor could poison independently of the TypeScript they submit. With
  # it, dist/ is a derived value CI re-derives from scratch on every PR, and the
  # only way into the viewer is through a reviewable source diff.
  #
  # This job is only meaningful if it cannot be skipped: for `pull_request`,
  # GitHub runs the workflow as written in the PR, so a PR may delete this job.
  # It must be a REQUIRED status check on main — otherwise a PR that removes it
  # merges green. See also CODEOWNERS on package*.json: `npm run build` executes
  # vite.config.ts and every plugin in node_modules, which `--ignore-scripts`
  # does not cover, so a lockfile change is arbitrary code execution here.
  frontend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Exact pin: this job's output IS the security property, so the
          # toolchain producing it should not float. Output was verified
          # byte-identical on 20.19.5 and 22.20.0, so a bump is safe.
          # Floor is now react-router 8.3.0's `engines.node: >=22.22.0` — the
          # only release patching GHSA-qwww-vcr4-c8h2 — so this cannot go back
          # below 22.22.0 without reintroducing that advisory.
          node-version: "22.23.2"
      - name: Rebuild the viewer bundle from source
        working-directory: src/nooa/viewer/frontend-react
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          # Build into an EMPTY dist/. Two reasons, both load-bearing:
          #  1. A file that is committed but that the build does not produce
          #     (i.e. smuggled in) then shows up as deleted rather than silently
          #     surviving untouched.
          #  2. The build must not see the artifact it is being checked against.
          #     src/index.css carries `@source not '../dist'` so Tailwind skips
          #     it; wiping dist/ means the check holds even if that regresses.
          rm -rf dist
          npm run build
          # Audit trail: the hashes CI derived, readable in the job log.
          sha256sum dist/index.html dist/assets/*
      - name: Fail if committed dist/ is not exactly what the build produced
        run: |
          set -euo pipefail
          DIST=src/nooa/viewer/frontend-react/dist
          # Guard against a vacuous pass. `git status --porcelain <path>` warns
          # on stderr and prints NOTHING when the path does not resolve, which
          # reads as success — so a wrong path or a relocated dist/ would report
          # a clean build having verified nothing. Same failure mode the
          # gitleaks job guards against below. Assert we are looking at real,
          # tracked files before trusting an empty result.
          test -d "$DIST" \
            || { echo "::error::$DIST does not exist — the build did not produce it"; exit 1; }
          test "$(git ls-files -- "$DIST" | wc -l)" -gt 0 \
            || { echo "::error::no tracked files under $DIST — the check would pass vacuously"; exit 1; }
          # `git status --porcelain`, not `git diff`: git diff only reports
          # tracked-and-modified files, so it passes a PR that ADDS a file to
          # dist/. Porcelain reports ' M' modified, '??' produced-but-uncommitted
          # and ' D'/'AD' committed-but-not-produced — all three are failures.
          CHANGES=$(git status --porcelain -- "$DIST")
          if [ -n "$CHANGES" ]; then
            echo "::error::dist/ does not match a clean rebuild of the committed source."
            echo "$CHANGES"
            echo
            echo "If you changed the viewer UI, rebuild and commit the result:"
            echo "  cd src/nooa/viewer/frontend-react && npm ci --ignore-scripts && rm -rf dist && npm run build"
            exit 1
          fi
          echo "OK — committed dist/ is reproducible from source."

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the scan covers all commits
      # Invokes the gitleaks binary directly rather than gitleaks/gitleaks-action.
      # That action is not on this org's GitHub Actions allowlist, and a
      # disallowed action fails the *entire workflow* at startup — which is why
      # every CI run since 2026-07-21 was a 0-second `startup_failure` and no
      # lint, test, or build job ran at all.
      #
      # Pinned to an exact version and checksum-verified: the binary is fetched
      # at runtime, so an unpinned tag would be an unreviewed remote dependency.
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          # `gitleaks git` exits 0 with "no leaks found" when it has no history
          # to read — a shallow clone scans 1 commit and passes vacuously, and a
          # non-repo scans 0. Fail loudly instead of reporting a clean scan.
          test "$(git rev-parse --is-inside-work-tree 2>/dev/null)" = "true" \
            || { echo "::error::not a git checkout — gitleaks would pass vacuously"; exit 1; }
          test "$(git rev-parse --is-shallow-repository)" = "false" \
            || { echo "::error::shallow clone — gitleaks would miss history (need fetch-depth: 0)"; exit 1; }
          ./gitleaks git --config .gitleaks.toml --redact --no-banner .
