name: WSL

# WSL 2 is the supported way to run nooa on Windows: a quick check on every PR,
# the full suite nightly. No third-party actions (the org's action allow-list
# blocks setup-wsl): import the official Ubuntu WSL rootfs with `wsl --import`
# and run scripts/wsl_ci.sh inside it.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wsl:
    # WSL 2 is available on windows-2022 runner images (see setup-wsl's docs).
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      MODE: ${{ github.event_name == 'pull_request' && 'quick' || 'full' }}
      WSL_UTF8: "1"  # wsl.exe prints UTF-16 otherwise
      ROOTFS_URL: https://cloud-images.ubuntu.com/wsl/releases/24.04/current/ubuntu-noble-wsl-amd64-wsl.rootfs.tar.gz
      SUMS_URL: https://cloud-images.ubuntu.com/wsl/releases/24.04/current/SHA256SUMS
    steps:
      # Keep LF line endings: the checkout is copied into Linux and run there.
      - name: Disable CRLF conversion
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags needed for uv-dynamic-versioning
          persist-credentials: false
      - name: WSL status
        run: |
          $ErrorActionPreference = "Continue"
          $info = ((& wsl.exe --status 2>&1) + (& wsl.exe --list --verbose 2>&1) | Out-String) -replace "`0", ""
          Write-Output $info
          Write-Output "::notice title=WSL on this runner::$($info.Trim() -replace "`r?`n", '%0A')"
          exit 0
      - name: Import Ubuntu 24.04 as a WSL 2 distribution
        run: |
          $ErrorActionPreference = "Stop"
          function Fail([string]$title, [string]$text) {
            Write-Output $text
            Write-Output "::error title=$title::$(($text -replace "`0", '').Trim() -replace "`r?`n", '%0A')"
            exit 1
          }
          try {
            $rootfs = Join-Path $env:RUNNER_TEMP "ubuntu-wsl.rootfs.tar.gz"
            $sumsFile = Join-Path $env:RUNNER_TEMP "SHA256SUMS"
            Invoke-WebRequest $env:ROOTFS_URL -OutFile $rootfs
            Invoke-WebRequest $env:SUMS_URL -OutFile $sumsFile
            $name = Split-Path $env:ROOTFS_URL -Leaf
            $line = Get-Content $sumsFile | Where-Object { $_ -match [regex]::Escape($name) } | Select-Object -First 1
            if (-not $line) { Fail "rootfs checksum missing" "no line for $name in SHA256SUMS" }
            $expected = ($line -split '\s+')[0].ToLower()
            $actual = (Get-FileHash $rootfs -Algorithm SHA256).Hash.ToLower()
            if ($expected -ne $actual) { Fail "rootfs checksum mismatch" "expected $expected, got $actual" }
          } catch {
            Fail "rootfs download failed" ($_ | Out-String)
          }
          # The runner's in-box WSL lacks the WSL 2 kernel ("WSL 2 requires an
          # update to its kernel component"): install it first.
          $upd = (wsl --update --web-download 2>&1 | Out-String) -replace "`0", ""
          if ($LASTEXITCODE -ne 0) { $upd += (wsl --update 2>&1 | Out-String) -replace "`0", "" }
          Write-Output $upd
          if ($LASTEXITCODE -ne 0) { Fail "wsl --update failed ($LASTEXITCODE)" $upd }
          wsl --set-default-version 2
          $out = (wsl --import nooa-ubuntu (Join-Path $env:RUNNER_TEMP "wsl") $rootfs --version 2 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Fail "wsl --import failed ($LASTEXITCODE)" $out }
          wsl --list --verbose
      - name: Tests inside WSL 2 (${{ env.MODE }})
        run: wsl --cd "$env:GITHUB_WORKSPACE" -d nooa-ubuntu -u root -- bash scripts/wsl_ci.sh $env:MODE
