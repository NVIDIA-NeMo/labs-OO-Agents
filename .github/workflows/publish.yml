# Publishes the five workspace packages to PyPI and the versioned nooa-bench
# Scaled Evals sidecar to GHCR.
#
# Trigger: a GitHub Release is *published* (the release's tag `vX.Y.Z` is what
# uv-dynamic-versioning turns into the package version — see RELEASING.md).
# Auth: PyPI Trusted Publishing (OIDC). No API tokens, no repo secrets.
#
# `workflow_dispatch` runs the same build against TestPyPI for a dry run.
#
# Every `uses:` here is an `actions/*` action, i.e. GitHub-created. That is
# deliberate: this org enforces an Actions allowlist, and a disallowed action
# fails the *entire workflow* at startup (see PR #50 — one blocked action left
# CI dead for 8 days). A publish workflow that cannot start is a publish
# workflow that silently never ships. uv is installed from a pinned, versioned
# install script and does the upload itself via `uv publish`.
name: Publish

on:
  release:
    types: [published]
  # Manual runs are ALWAYS a TestPyPI dry run. There is deliberately no input
  # to select the index: real PyPI is reachable only by publishing a GitHub
  # Release, so a mis-click here cannot burn a version number on PyPI.
  workflow_dispatch:

permissions: {}

env:
  # Pinned: the install script is fetched at runtime, so an unversioned URL
  # would make every run depend on whatever uv ships that day.
  UV_VERSION: "0.11.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags needed for uv-dynamic-versioning

      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --no-sources: build with `tool.uv.sources` disabled, so the build is
      # exercised the way a non-uv consumer's build backend would see it. Without
      # it, a workspace source could paper over a dependency that is unresolvable
      # off this machine. Recommended by
      # https://docs.astral.sh/uv/guides/package/
      - name: Build all packages
        run: |
          rm -rf dist
          for pkg in nooa nooa-cli nooa-acp nooa-memory nooa-bench; do
            uv build --no-sources --package "$pkg" --out-dir dist
          done
          ls -l dist

      # Guards the two ways a release can silently ship the wrong version:
      # a shallow checkout (no tag reachable -> `.devN`), or a Release created
      # from a commit that is not the tagged one.
      - name: Check built version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import os, pathlib, sys
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version

          expected = Version(os.environ["TAG"].removeprefix("v"))
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 5, f"expected 5 wheels, got {[w.name for w in wheels]}"
          for whl in wheels:
              _, version, _, _ = parse_wheel_filename(whl.name)
              if version.is_devrelease:
                  sys.exit(f"{whl.name}: dev version — the tag is not reachable from HEAD")
              if version != expected:
                  sys.exit(f"{whl.name}: built {version}, but the tag says {expected}")
          print(f"OK — all five packages built as {expected}")
          PY

      # Catches a broken wheel before it is on PyPI forever.
      - name: Smoke-test the wheels in a clean environment
        run: |
          uv venv /tmp/smoke --python 3.12
          VIRTUAL_ENV=/tmp/smoke uv pip install \
            dist/nooa-*.whl dist/nooa_cli-*.whl dist/nooa_acp-*.whl \
            dist/nooa_memory-*.whl dist/nooa_bench-*.whl
          /tmp/smoke/bin/python -c "import nooa, nooa_cli, nooa_acp, nooa_memory, nooa_bench; print(nooa.__version__)"
          /tmp/smoke/bin/nooa --version
          /tmp/smoke/bin/nooa --help
          /tmp/smoke/bin/nooa-acp --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # One job per package, each in its OWN environment (`pypi-<package>`).
  #
  # PyPI keys a *pending* trusted publisher on
  # (owner, repo, workflow filename, environment). Five packages sharing one
  # environment collide: PyPI rejects the 2nd registration with "a pending
  # trusted publisher matching this configuration has already been registered
  # for a different project name", because it cannot tell which project to
  # create on first upload. A distinct environment per package makes each
  # tuple unique. (The constraint applies only while a publisher is pending —
  # but a distinct environment is also what gives per-package approval gates.)
  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # a partial publish is recoverable; a cancelled one is messier
      matrix:
        package: [nooa, nooa-cli, nooa-acp, nooa-memory, nooa-bench]
    environment:
      name: testpypi-${{ matrix.package }}
      url: https://test.pypi.org/p/${{ matrix.package }}
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Upload only this package's files. Distribution filenames normalise `-`
      # to `_`, and the glob anchors on the `-` before the version, so
      # `nooa-*` matches nooa's own files and never `nooa_cli-*`.
      - name: Isolate this package's artifacts
        env:
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir upload
          cp dist/"${PKG//-/_}"-* upload/
          test "$(ls upload | wc -l)" -eq 2  # exactly one wheel + one sdist
          ls -l upload
      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # --trusted-publishing always: never silently fall back to looking for a
      # token if the OIDC exchange fails. Fail instead, so a broken publisher
      # config surfaces as an error rather than an auth prompt.
      - name: Publish to TestPyPI
        run: |
          uv publish --trusted-publishing always \
            --publish-url https://test.pypi.org/legacy/ \
            --check-url https://test.pypi.org/simple/ \
            upload/*

  publish-pypi:
    needs: build
    # Real PyPI is reachable ONLY from a published GitHub Release.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [nooa, nooa-cli, nooa-acp, nooa-memory, nooa-bench]
    environment:
      name: pypi-${{ matrix.package }}
      url: https://pypi.org/p/${{ matrix.package }}
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Upload only this package's files. Distribution filenames normalise `-`
      # to `_`, and the glob anchors on the `-` before the version, so
      # `nooa-*` matches nooa's own files and never `nooa_cli-*`.
      - name: Isolate this package's artifacts
        env:
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir upload
          cp dist/"${PKG//-/_}"-* upload/
          test "$(ls upload | wc -l)" -eq 2  # exactly one wheel + one sdist
          ls -l upload
      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # --trusted-publishing always: never silently fall back to looking for a
      # token if the OIDC exchange fails. Fail instead, so a broken publisher
      # config surfaces as an error rather than an auth prompt.
      #
      # --check-url makes a re-run idempotent: already-uploaded files are
      # skipped rather than erroring. Matters because `fail-fast: false` means
      # a partial publish is a state you can land in and need to resume from.
      - name: Publish to PyPI
        run: |
          uv publish --trusted-publishing always \
            --check-url https://pypi.org/simple/ \
            upload/*

  # Build the Scaled Evals agent sidecar from the same immutable release tag as
  # the Python distributions. Bullseye is load-bearing: Ubuntu 20.04
  # SWE-bench task images expose GLIBC 2.31 and cannot load a Bookworm-built
  # Python runtime. The recorded digest is the immutable identity; deliberately
  # do not publish a floating `latest` tag.
  build-agent-bundle:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and prepare the versioned bundle context
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::release tag must be canonical vX.Y.Z: $RELEASE_TAG"; exit 1 ;;
          esac
          VERSION="${RELEASE_TAG#v}"
          REVISION="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$REVISION" = "$GITHUB_SHA" \
            || { echo "::error::release tag does not resolve to GITHUB_SHA"; exit 1; }
          mkdir -p build
          python scripts/prepare_nooa_bench_bundle.py \
            --version "$VERSION" \
            --source-ref "$RELEASE_TAG" \
            --revision "$REVISION" \
            --output build/nooa-bench-agent \
            > build/nooa-bench-agent-summary.json
          LOCK_SHA="$(jq -r '.uv_lock_digest | sub("^sha256:"; "")' \
            build/nooa-bench-agent/source-lock.json)"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "version=$VERSION"
            echo "revision=$REVISION"
            echo "lock_sha=$LOCK_SHA"
            echo "image_repository=ghcr.io/$OWNER/nooa-bench-agent"
            echo "image_ref=ghcr.io/$OWNER/nooa-bench-agent:$VERSION"
          } >> "$GITHUB_ENV"

      - name: Build and smoke-test the Bullseye bundle
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --build-arg "NOOA_VERSION=$version" \
            --build-arg "NOOA_UV_LOCK_SHA256=$lock_sha" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$revision" \
            --tag "$image_ref" \
            build/nooa-bench-agent

          set -a
          . build/nooa-bench-agent/bundle.env
          set +a
          docker run --rm --platform linux/amd64 --user 1000:1000 --read-only \
            --tmpfs /tmp:rw,exec,uid=1000,gid=1000,mode=1777 \
            --tmpfs /bundle-output:rw,exec,uid=1000,gid=1000,mode=0755 \
            -e HOME=/tmp/bundle-home \
            -e "ASTRA_AGENT_NAME=$BUNDLE_AGENT_NAME" \
            -e "ASTRA_AGENT_VERSION=$BUNDLE_AGENT_VERSION" \
            -e "ASTRA_AGENT_PLATFORM=$BUNDLE_AGENT_PLATFORM" \
            -e "ASTRA_AGENT_RUNTIME_ABI=$BUNDLE_AGENT_RUNTIME_ABI" \
            -e "ASTRA_AGENT_BUNDLE_LAYOUT_VERSION=$BUNDLE_LAYOUT_VERSION" \
            -e "ASTRA_AGENT_BUILDER_PROFILE=$BUNDLE_BUILDER_PROFILE" \
            -e "ASTRA_AGENT_SOURCE_LOCK_DIGEST=$BUNDLE_SOURCE_LOCK_DIGEST" \
            -e "ASTRA_AGENT_BUNDLE_FINGERPRINT=$BUNDLE_FINGERPRINT" \
            "$image_ref" /bundle-output

      - name: Publish the immutable image and release metadata
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image_ref"
          IMAGE_DIGEST="$(
            docker buildx imagetools inspect "$image_ref" \
              | awk '$1 == "Digest:" {print $2; exit}'
          )"
          python - "$IMAGE_DIGEST" <<'PY'
          import re
          import sys

          if re.fullmatch(r"sha256:[0-9a-f]{64}", sys.argv[1]) is None:
              raise SystemExit(f"invalid image digest: {sys.argv[1]}")
          PY

          mkdir -p agent-bundle-release
          cp build/nooa-bench-agent/descriptor.json \
            "agent-bundle-release/nooa-bench-agent-$version-descriptor.json"
          cp build/nooa-bench-agent/source-lock.json \
            "agent-bundle-release/nooa-bench-agent-$version-source-lock.json"
          IMAGE_REPOSITORY="$image_repository" IMAGE_REF="$image_ref" \
            IMAGE_DIGEST="$IMAGE_DIGEST" \
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          descriptor = json.loads(Path("build/nooa-bench-agent/descriptor.json").read_text())
          source_lock = json.loads(Path("build/nooa-bench-agent/source-lock.json").read_text())
          manifest = {
              "schema_version": 1,
              "status": "github-release-candidate",
              **descriptor,
              "source_revision": source_lock["source_revision"],
              "source_tree_digest": source_lock["source_tree_digest"],
              "uv_lock_digest": source_lock["uv_lock_digest"],
              "image_ref": os.environ["IMAGE_REF"],
              "image_digest": (
                  f'{os.environ["IMAGE_REPOSITORY"]}@{os.environ["IMAGE_DIGEST"]}'
              ),
              "scaled_evals_signature": None,
              "qualification": "internal-promotion-required",
          }
          output = Path("agent-bundle-release") / (
              f'nooa-bench-agent-{descriptor["agent_version"]}-manifest.json'
          )
          output.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PY
          (cd agent-bundle-release && sha256sum *.json > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: nooa-bench-agent-bundle
          path: agent-bundle-release/
          retention-days: 90

  # Attach the built wheels to the GitHub Release so `pip install <url>` and
  # air-gapped consumers get the exact artifacts that went to PyPI.
  attach-to-release:
    needs: publish-pypi
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # The tag name goes through `env:`, not `${{ }}` inside the script.
      # GitHub expands `${{ }}` textually *before* bash parses the line, so a
      # tag containing `$(...)` or backticks would execute — double quotes do
      # not help, because the substitution happens before quoting is applied.
      # This job holds `contents: write`. Via env, bash sees the value as data.
      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"

  attach-agent-bundle-to-release:
    needs: build-agent-bundle
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nooa-bench-agent-bundle
          path: agent-bundle-release/
      - name: Attach bundle provenance to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" agent-bundle-release/* \
            --repo "$GITHUB_REPOSITORY"
