<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="120"
     viewBox="0 0 1200 120"
     role="img"
     aria-labelledby="title desc">
  <title id="title">NVIDIA-labs Object Oriented Agents</title>
  <desc id="desc">Single-line wordmark for NVIDIA-labs Object Oriented Agents</desc>

  <style>
    .wordmark {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 54px;
      font-weight: 700;
      letter-spacing: -0.8px;
    }

    .nvidia {
      fill: #76B900;
    }

    .title-text {
      fill: #6E7781;
    }

    @media (prefers-color-scheme: dark) {
      .title-text {
        fill: #E6EDF3;
      }
    }
  </style>

  <text x="600" y="78" text-anchor="middle" class="wordmark">
    <tspan class="nvidia">NVIDIA-labs</tspan>
    <tspan class="title-text"> Object Oriented Agents</tspan>
  </text>
</svg>
