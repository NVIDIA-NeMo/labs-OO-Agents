[project]
name = "nooa-acp"
dynamic = ["version"]
description = "Superseded by nooa-coder; installs nooa-coder, which provides the NOOA ACP server"
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Tombstone: no code of its own. The `nooa-acp` console script and the
# `nooa acp` command are provided by nooa-coder.
dependencies = [
    "nooa-coder",
]

[project.urls]
Homepage = "https://github.com/NVIDIA-NeMo/labs-OO-Agents"
Repository = "https://github.com/NVIDIA-NeMo/labs-OO-Agents"
Issues = "https://github.com/NVIDIA-NeMo/labs-OO-Agents/issues"

[tool.uv.sources]
nooa-coder = { workspace = true }

[build-system]
requires = ["hatchling>=1.26.0", "uv-dynamic-versioning>=0.14.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
metadata = false
fallback-version = "0.0.6"

[tool.hatch.build.targets.wheel]
# Metadata-only wheel: nothing to include.
bypass-selection = true
