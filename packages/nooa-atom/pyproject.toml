[project]
name = "nooa-atom"
dynamic = ["version"]
description = "NOOAn Atom agent, session layer, session tree and in-process host"
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nooa[mcp]",
    # The `nooa` command; the server is its `atom` subcommand. `[ast]` brings the
    # tree-sitter grammars so RepoTools uses AST-aware code analysis by default.
    "nooa-cli[ast]",
    "agent-client-protocol>=0.12.1,<0.13",
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    # nooa atom --http (ACP over WebSocket).
    "websockets>=14",
]

[project.entry-points."nooa_cli.commands"]
atom = "nooa_atom.acp.cli:command"

[project.optional-dependencies]
# tree-sitter is now a regular dependency (via nooa-cli[ast]); kept so existing
# `nooa-atom[ast]` installs still resolve.
ast = []

[project.urls]
Homepage = "https://github.com/NVIDIA-NeMo/labs-OO-Agents"
Repository = "https://github.com/NVIDIA-NeMo/labs-OO-Agents"
Issues = "https://github.com/NVIDIA-NeMo/labs-OO-Agents/issues"

[tool.uv.sources]
nooa = { workspace = true }

[build-system]
requires = ["hatchling>=1.26.0", "uv-dynamic-versioning>=0.14.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
metadata = false
fallback-version = "0.0.6"

[tool.hatch.build.targets.wheel]
packages = ["src/nooa_atom"]
