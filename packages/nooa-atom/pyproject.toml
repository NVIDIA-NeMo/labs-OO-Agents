[project]
name = "nooa-atom"
dynamic = ["version"]
description = "NOOAn Atom agent, session layer, session tree and in-process host"
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nooa[mcp]",
    # The `nooa` command; the server is its `atom` subcommand. `[ast]` brings the
    # tree-sitter grammars so RepoTools uses AST-aware code analysis by default.
    "nooa-cli[ast]",
    "agent-client-protocol>=0.12.1,<0.13",
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    # nooa atom --http (ACP over WebSocket).
    "websockets>=14",
]

[project.entry-points."nooa_cli.commands"]
atom = "nooa_atom.acp.cli:command"

[project.optional-dependencies]
# tree-sitter is now a regular dependency (via nooa-cli[ast]); kept so existing
# `nooa-atom[ast]` installs still resolve.
ast = []

# Explicit benchmark runtime profile; normal Atom installs do not acquire this bundle.
# Pins include the reviewed library closure and optional native OTLP capability.
# Benchmarks keep live OTLP disabled unless their protocol explicitly enables it.
benchmark = [
    "nooa-bench",
    "beautifulsoup4==4.15.0",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.63.0",
    "googleapis-common-protos==1.75.0",
    "html5lib==1.1",
    "icalendar==7.2.2",
    "iniconfig==2.3.0",
    "kiwisolver==1.5.0",
    "matplotlib==3.11.0",
    "numpy==2.5.0",
    "opentelemetry-exporter-otlp-proto-common==1.43.0",
    "opentelemetry-exporter-otlp-proto-http==1.43.0",
    "opentelemetry-proto==1.43.0",
    "packaging==26.2",
    "pandas==3.0.3",
    "pillow==12.3.0",
    "pluggy==1.6.0",
    "protobuf==7.35.1",
    "pygments==2.20.0",
    "pyoxigraph==0.5.9",
    "pyparsing==3.3.2",
    "pytest==9.1.1",
    "python-dateutil==2.9.0.post0",
    "rdflib==7.6.0",
    "scipy==1.18.0",
    "six==1.17.0",
    "soupsieve==2.9.2",
    "typing-extensions==4.16.0",
    "tzdata==2026.2",
    "webencodings==0.6.1",
]

[project.urls]
Homepage = "https://github.com/NVIDIA-NeMo/labs-OO-Agents"
Repository = "https://github.com/NVIDIA-NeMo/labs-OO-Agents"
Issues = "https://github.com/NVIDIA-NeMo/labs-OO-Agents/issues"

[tool.uv.sources]
nooa = { workspace = true }
nooa-bench = { workspace = true }

[build-system]
requires = ["hatchling>=1.26.0", "uv-dynamic-versioning>=0.14.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
metadata = false
fallback-version = "0.0.6"

[tool.hatch.build.targets.wheel]
packages = ["src/nooa_atom"]
