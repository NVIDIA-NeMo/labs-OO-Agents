[project]
name = "nooa-cli"
# Version is derived from git tags at build time by uv-dynamic-versioning.
dynamic = ["version"]
description = "CLI for nemo-oo-agents (`nooa` command: eval runner, trace viewer, config)"
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Floor reflects the actual minimum-compatible core (bump when the cli
    # starts to require a newer core API). No auto-lockstep — published
    # wheels declare what they actually need, not what was co-released.
    "nooa",
    "click>=8.1.0",
    # CLI config files
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0.52",
]

[project.urls]
Homepage = "https://github.com/NVIDIA-NeMo/labs-OO-Agents"
Repository = "https://github.com/NVIDIA-NeMo/labs-OO-Agents"
Issues = "https://github.com/NVIDIA-NeMo/labs-OO-Agents/issues"

[project.scripts]
nooa = "nooa_cli:main"

[tool.uv.sources]
nooa = { workspace = true }

[build-system]
requires = ["hatchling>=1.26.0", "uv-dynamic-versioning>=0.14.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
metadata = false
fallback-version = "0.0.6"

[tool.hatch.build.targets.wheel]
packages = ["src/nooa_cli"]
