[project]
name = "nooa-coder"
dynamic = ["version"]
description = "NOOA coding agent: engine, durable sessions, and ACP server"
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nooa[mcp]",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "agent-client-protocol>=0.11,<0.12",
    # 1.95.0 has no macOS wheels and requires a newer Rust than common toolchains.
    "litellm!=1.95.0",
]

[project.optional-dependencies]
# AST-aware code analysis for RepoTools (tree-sitter grammars).
# The coding agent works without these — RepoTools falls back to regex.
ast = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
]
# Data-science stack pre-loaded into the agent's REPL execution namespace
# (np, pd, px, go, scipy, sklearn). Soft-imported via try/except; they
# exist purely so LLM-generated CodeAct cells can use these libs without
# first failing on a missing import.
datascience = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/NVIDIA-NeMo/labs-OO-Agents"
Repository = "https://github.com/NVIDIA-NeMo/labs-OO-Agents"
Issues = "https://github.com/NVIDIA-NeMo/labs-OO-Agents/issues"

[project.scripts]
nooa-coder = "nooa_coder.acp.cli:main"
# Alias kept so editor configurations that launch `nooa-acp --model ...` keep working.
nooa-acp = "nooa_coder.acp.cli:main"

[project.entry-points."nooa.skills"]
"nemo.repo" = "nooa_coder.tools.repo_tools:RepoTools"

[project.entry-points."nooa_cli.commands"]
acp = "nooa_coder.acp.cli:command"

[tool.uv.sources]
nooa = { workspace = true }

[build-system]
requires = ["hatchling>=1.26.0", "uv-dynamic-versioning>=0.14.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
metadata = false
fallback-version = "0.0.6"

[tool.hatch.build.targets.wheel]
packages = ["src/nooa_coder"]
