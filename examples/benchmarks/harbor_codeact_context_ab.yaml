# Minimal A/B Harbor configuration for long-context CodeAct evaluation.
#
# Run from the repo root:
#   PYTHONPATH=examples/benchmarks harbor run --config examples/benchmarks/harbor_codeact_context_ab.yaml
#
# Keep the two agents identical except for agent_type:
#   bench-codeact      = CodeAct baseline, no context-management APIs exposed
#   bench-codeact-acm  = CodeAct with self-managed context APIs exposed
jobs_dir: /tmp/harbor_jobs
n_attempts: 1
orchestrator:
  type: local
  n_concurrent_trials: 1
environment:
  type: apptainer
  kwargs:
    apptainer_binary: apptainer
agents:
  - import_path: harbor_adapter:NooaBenchAgent
    model_name: openai/nvidia/nvidia/nemotron-3-ultra-preview
    kwargs:
      git_url: https://github.com/NVIDIA-NeMo/labs-OO-Agents.git
      # Set git_ref to this branch/SHA after publishing the worktree branch.
      # git_ref: acm-swe-style-eval
      api_base: https://inference-api.nvidia.com/v1
      agent_type: bench-codeact
  - import_path: harbor_adapter:NooaBenchAgent
    model_name: openai/nvidia/nvidia/nemotron-3-ultra-preview
    kwargs:
      git_url: https://github.com/NVIDIA-NeMo/labs-OO-Agents.git
      # Set git_ref to this branch/SHA after publishing the worktree branch.
      # git_ref: acm-swe-style-eval
      api_base: https://inference-api.nvidia.com/v1
      agent_type: bench-codeact-acm
datasets:
  - path: /path/to/your/swe-bench-style/tasks/
