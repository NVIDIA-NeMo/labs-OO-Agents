# Minimal Long-Horizon Terminal-Bench A/B config for NOOA CodeAct agents.
#
# Run from this repo root after cloning LHTB next to it:
#   PYTHONPATH=examples/benchmarks harbor run --config examples/benchmarks/harbor_lhtb_codeact_context_ab_small.yaml
#
# For LHTB-compatible scoring, run this with the patched Harbor bundled in:
#   https://github.com/zli12321/LHTB/tree/main/harbor
#
# Keep the two arms identical except for agent_type:
#   bench-codeact      = CodeAct baseline, no context-management APIs exposed
#   bench-codeact-acm  = CodeAct with self-managed context APIs exposed
job_name: nooa-lhtb-codeact-context-ab-small
jobs_dir: ./jobs/lhtb-codeact-context-ab-small
n_attempts: 1
n_concurrent_trials: 1
timeout_multiplier: 1.0
environment:
  type: docker
  force_build: false
  delete: true
agents:
  - import_path: harbor_adapter:NooaBenchAgent
    model_name: openai/nvidia/qwen/qwen3.6-35b-a3b
    # LHTB reference runs use 5400 seconds. Lower this only for smoke testing.
    override_timeout_sec: 5400
    kwargs:
      git_url: https://github.com/NVIDIA-NeMo/labs-OO-Agents.git
      git_ref: acm-swe-style-eval
      api_base: https://inference-api.nvidia.com/v1
      agent_type: bench-codeact
      llm_kwargs:
        max_tokens: 16384
  - import_path: harbor_adapter:NooaBenchAgent
    model_name: openai/nvidia/qwen/qwen3.6-35b-a3b
    override_timeout_sec: 5400
    kwargs:
      git_url: https://github.com/NVIDIA-NeMo/labs-OO-Agents.git
      git_ref: acm-swe-style-eval
      api_base: https://inference-api.nvidia.com/v1
      agent_type: bench-codeact-acm
      llm_kwargs:
        max_tokens: 16384
datasets:
  - path: ../LHTB/tasks
    task_names:
      - langchain-version-migration
      - commit0-multilib-tdd
      - duckdb-optimizer-closure
