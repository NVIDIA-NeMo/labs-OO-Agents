# Centralized Model Configuration
# API keys are referenced by environment variable name (stored in .env)
# This file is shared across all applications in the project
#
# NOTE: model_name is the full litellm model string including routing prefix
# For custom endpoints, use openai/{api_model} format

models:
  # =========================================================================
  # JUDGE MODELS (small, fast models for LLM-as-judge evaluation)
  # =========================================================================

  # Default judge model - Nano v3 on AIRE (reasoning model)
  nvidia/nano-v3:
    name: "Nemotron Nano v3"
    model_name: openai/nvidia/nano-v3  # litellm format: openai/{api_model}
    provider: nvidia
    endpoint: https://your-nim-endpoint.example.com/v1
    api_key_env: NVIDIA_API_KEY
    tags: [judge, small, reasoning]
    reasoning_model: true
    temperature: 0.6
    top_p: 0.95
    max_tokens: 16384

  # Nemotron 3 Nano 30B A3B - larger reasoning model
  nvidia/nemotron3-nano-30b:
    name: "Nemotron 3 Nano 30B A3B"
    model_name: openai/nvidia/nvidia/Nemotron-3-Nano-30B-A3B
    provider: nvidia_internal
    endpoint: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_INFERENCE_API_KEY
    tags: [reasoning, medium]
    reasoning_model: true
    temperature: 0.7
    top_p: 0.7
    max_tokens: 16384

  # Alternative judge model (7B params)
  nvidia_nim/qwen/qwen2.5-7b-instruct:
    name: "Qwen 2.5 7B Instruct"
    model_name: openai/qwen/qwen2.5-7b-instruct  # litellm format
    provider: nvidia
    endpoint: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    tags: [judge, small]

  # =========================================================================
  # NVIDIA NIM Models (Public - integrate.api.nvidia.com)
  # =========================================================================

  nvidia_nim/qwen/qwen3-next-80b-a3b-instruct:
    name: "Qwen3 Next 80B Instruct"
    model_name: openai/qwen/qwen3-next-80b-a3b-instruct
    provider: nvidia
    endpoint: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY

  nvidia_nim/qwen/qwen3-coder-480b-a35b-instruct:
    name: "Qwen3 Coder 480B Instruct"
    model_name: openai/qwen/qwen3-coder-480b-a35b-instruct
    provider: nvidia
    endpoint: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY

  nvidia_nim/qwen/qwen3-next-80b-a3b-thinking:
    name: "Qwen3 Next 80B Thinking"
    model_name: openai/qwen/qwen3-next-80b-a3b-thinking
    provider: nvidia
    endpoint: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY

  # Nemotron Super 49B - Large reasoning model (fits on single H100)
  nvidia_nim/nvidia/llama-3.3-nemotron-super-49b-v1.5:
    name: "Llama 3.3 Nemotron Super 49B"
    model_name: openai/nvidia/llama-3.3-nemotron-super-49b-v1.5
    provider: nvidia
    endpoint: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    tags: [reasoning, large]
    reasoning_model: true
    temperature: 0.6
    top_p: 0.95

  nvidia_nim/openai/gpt-oss-20b:
    name: "GPT-OSS 20B"
    model_name: openai/nvidia/openai/gpt-oss-20b  # litellm needs openai/{api_model}
    provider: nvidia_internal
    endpoint: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_INFERENCE_API_KEY
    reasoning_model: true
    reasoning_effort: medium
    max_thinking_tokens: 4096  # Cap reasoning to ensure room for content output
    temperature: 1.0
    top_p: 1.0
    max_tokens: 16384
    # Retry on empty content (reasoning models sometimes return only reasoning)
    max_retries: 3
    retry_on_empty_content: true

  nvidia_nim/openai/gpt-oss-120b:
    name: "GPT-OSS 120B"
    model_name: openai/nvidia/openai/gpt-oss-120b
    provider: nvidia_internal
    endpoint: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_INFERENCE_API_KEY
    reasoning_model: true
    reasoning_effort: medium
    max_thinking_tokens: 4096  # Cap reasoning to ensure room for content output
    temperature: 1.0
    top_p: 1.0
    max_tokens: 16384
    # Retry on empty content (reasoning models sometimes return only reasoning)
    max_retries: 3
    retry_on_empty_content: true

  # =========================================================================
  # NVIDIA Internal Models (inference-api.nvidia.com)
  # =========================================================================

  azure/openai/o4-mini:
    name: "o4-mini (NVIDIA Internal)"
    model_name: openai/azure/openai/o4-mini
    provider: nvidia_internal
    endpoint: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_INFERENCE_API_KEY
    temperature: 1.0

  azure/openai/gpt-5.1:
    name: "GPT-5.1 (NVIDIA Internal)"
    model_name: openai/azure/openai/gpt-5.1
    provider: nvidia_internal
    endpoint: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_INFERENCE_API_KEY

  azure/anthropic/claude-haiku-4-5:
    name: "Claude Haiku 4.5 (NVIDIA Internal)"
    model_name: openai/azure/anthropic/claude-haiku-4-5
    provider: nvidia_internal
    endpoint: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_INFERENCE_API_KEY

  aws/anthropic/bedrock-claude-sonnet-4-5-v1:
    name: "Claude Sonnet 4.5 (NVIDIA Internal)"
    model_name: openai/aws/anthropic/bedrock-claude-sonnet-4-5-v1
    provider: nvidia_internal
    endpoint: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_INFERENCE_API_KEY

  gcp/google/gemini-3-pro:
    name: "Gemini 3 Pro (NVIDIA Internal)"
    model_name: openai/gcp/google/gemini-3-pro
    provider: nvidia_internal
    endpoint: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_INFERENCE_API_KEY

  gcp/google/gemini-2.5-flash-lite:
    name: "Gemini 2.5 Flash Lite (NVIDIA Internal)"
    model_name: openai/gcp/google/gemini-2.5-flash-lite
    provider: nvidia_internal
    endpoint: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_INFERENCE_API_KEY
    tags: [fast, small]

# Default model for each use case
defaults:
  playground: azure/openai/o4-mini
  evaluation: azure/openai/gpt-5.1
  agent: aws/anthropic/bedrock-claude-sonnet-4-5-v1
  judge: nvidia/nano-v3
