[project]
name = "output-validation"
version = "0.1.0"
description = "Local self-check of instructions and mask outputs (format/range/consistency) without using GT."
dependencies = ["nooa"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
output_validation = ["resources/**"]

[project.entry-points."nooa.skills"]
"local.output-validation" = "output_validation:OutputValidation"
