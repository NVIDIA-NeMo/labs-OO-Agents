[project]
name = "threat-detection"
version = "0.1.0"
description = "Exact detection thresholds for identifying malicious network patterns including port scans, DoS attacks, and beaconing behavior."
dependencies = ["nooa"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
threat_detection = ["resources/**"]

[project.entry-points."nooa.skills"]
"local.threat-detection" = "threat_detection:ThreatDetection"
