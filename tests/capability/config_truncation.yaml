        class: ExactMatchScorer
        weight: 1.0
  # ---- TEST 15: <type len=N> pattern across container types ----
  # Validates the pattern generalizes beyond lists:
  # <dict len=N>{...}</dict>, <Pydantic ...>, deeply nested, JSON-shaped.

  - name: truncation_size_v3_dict
