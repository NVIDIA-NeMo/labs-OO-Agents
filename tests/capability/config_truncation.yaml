  # ---- TEST 11: Consolidated `... +N` length idiom (vs today's verbose) ----
  # Same questions as TEST 1 (size) and TEST 3 (partial) and TEST 6 (nested_partial)
  # but with the proposed consolidated `... +N` length-truncation marker
  # (replacing today's verbose `... N items not shown ...`).
  # Compare scores against truncation_{size,partial,nested_partial}_before to see
  # if consolidation hurts comprehension.

  - name: truncation_size_consolidated
    description: "Count items with consolidated '... +N' middle-elision marker (3.0)"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
