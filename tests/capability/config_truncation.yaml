        class: ExactMatchScorer
        weight: 1.0

  - name: truncation_size_v7_len_attr
    description: "Python len= convention: [a, b, ..., y, z]  # len=100"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_size_v7_len_attr.jsonl
    scorers:
