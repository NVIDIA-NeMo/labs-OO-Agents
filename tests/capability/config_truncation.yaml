  # ---- TEST 12: Depth marker '{Type: N items}' (unchanged in 3.0) ----

  - name: truncation_depth_marker
    description: "Comprehend '{Type: N items}' depth marker — extract sibling, refuse on contained"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_depth_marker.jsonl
    scorers:
      - name: exact_match
        class: ExactMatchScorer
        weight: 1.0

  # ---- TEST 13: String slice 'foo'+N (rich legacy idiom; pformat keeps it) ----

  - name: truncation_string_slice_legacy
    description: "Comprehend rich's 'foo'+N string-truncation idiom"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_string_slice_legacy.jsonl
    scorers:
      - name: substring_match
        class: LLMJudgeScorer
        weight: 1.0
        model: nemotron3-nano-30b
        rubric: |
          Does the answer mention or contain the expected phrase, or correctly say UNKNOWN?

          Answer: {output}
          Expected: {expected}

          Pass=true if expected appears verbatim or is the core of the answer,
          OR (when expected is UNKNOWN) the answer says it cannot tell.

  # ---- TEST 14: Size-marker shape optimization ----
  # Five variants of length truncation tested against the 8-model matrix to find
  # the shape with highest counting comprehension WITHOUT a teaching prompt.
  # Baseline: today's verbose `... N items not shown ...` form (truncation_size_before).
  # Goal: >95% pass rate across small models.

  - name: truncation_size_v1_total_prefix
    description: "Total upfront, no inline marker: [100 items: a, b, ..., y, z]"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_size_v1_total_prefix.jsonl
    scorers:
      - name: exact_match
        class: ExactMatchScorer
        weight: 1.0

  - name: truncation_size_v2_natural_prose
    description: "Natural prose: [a, b, ... and 90 more items ..., y, z]"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_size_v2_natural_prose.jsonl
    scorers:
      - name: exact_match
        class: ExactMatchScorer
        weight: 1.0

  - name: truncation_size_v3_xml_len
    description: "XML-style len attr: <list len=100>[a, b, ..., y, z]</list>"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_size_v3_xml_len.jsonl
