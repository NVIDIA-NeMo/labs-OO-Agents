    description: "Index into list past a captured-stream element (3.0 markers)"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_marker_after.jsonl
    scorers:
      - name: exact_match
        class: ExactMatchScorer
        weight: 1.0

  # ---- TEST 5: nested_value (extract from a fully-shown nested dict despite an adjacent truncated container) ----

  - name: truncation_nested_value_before
    description: "Extract a value from nested dict; sibling field is truncated (no wrapper)"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
