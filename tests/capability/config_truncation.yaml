        class: ExactMatchScorer
        weight: 1.0

  - name: truncation_partial_consolidated
    description: "Refuse with consolidated '... +N' marker"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_partial_consolidated.jsonl
    scorers:
      - name: exact_match
        class: ExactMatchScorer
        weight: 1.0

  - name: truncation_nested_partial_consolidated
    description: "Refuse on inner '... +N' elision in nested structure"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_nested_partial_consolidated.jsonl
    scorers:
