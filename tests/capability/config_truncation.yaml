        class: ExactMatchScorer
        weight: 1.0

  - name: truncation_partial_after
    description: "Refuse to answer when target data is in the elided middle (<preview> wrapper)"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_partial_after.jsonl
    scorers:
      - name: exact_match
        class: ExactMatchScorer
        weight: 1.0

  # ---- TEST 4: marker_vs_content ----
