  # ---- TEST 17: Apples-to-apples truncation-awareness ----
  # Same data (unordered list), same 4 questions, 4 wrapper styles.
  # Tests whether the model understands the LIST IS TRUNCATED, not just
  # whether it can parse the count. Includes "min value?" which has UNKNOWN
