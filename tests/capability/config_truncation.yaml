# Truncation comprehension capability tests.
#
# Each test concept (size, error, partial, marker) ships in two variants:
#   - _before: today's pformat output (no <preview> wrapper, <truncated-output>)
#   - _after:  truncation 3.0 output (<preview> wrapper, shorter <truncated>)
#
# Run before the implementation lands; treat scores as the empirical baseline
# for whether the proposed marker design helps small LLMs comprehend partial data.
#
# Run with:
#   uv run python -m eval_pipeline \
#     --config tests/capability/config_truncation.yaml \
#     --models claude-haiku-azure,gemini-3-flash-preview,nemotron3-nano-30b \
#     --runs 3 --parallel 8

name: truncation_comprehension
no_cache: true
description: "Tests whether models correctly interpret truncation markers in rendered context"

agent_models:
  # Matrix spans small/mini-class through flagship models.
  # Excluded:
  #   llama-3.1-8b — JSON output instability under PredictStrategy.
  #   gpt-oss-20b  — works under PredictStrategy (~96%) but tool-calling
  #                  protocol failures under CodeAct (0%).
  # Small/mini class:
  - nemotron3-nano-30b       # ~30B
  - nemotron-super-49b       # ~49B
  - claude-haiku-azure       #  small/medium, Azure-routed Anthropic
  - gemini-3-flash-preview   #  flash-class
  - gemini-2.5-flash-lite    #  flash-lite (smallest Gemini)
  - gpt-5-mini               #  mini-class
  - qwen3-80b                # ~80B (3B-active MoE — functionally small)
  - qwen3.5-35b              # ~35B (3B-active MoE)
  # Flagship class (added later — does the recommendation hold up-scale?):
  - gpt-5.2                  #  GPT-5 full
  - claude-sonnet            #  Claude Sonnet
  - nemotron-3-super-v3      # Nemotron-3 Super v3 (replaces -preview)
  - gemini-2.5-pro           #  Gemini 2.5 Pro
  - gemini-3.1-pro-preview   #  Gemini 3.1 Pro preview (largest, 1M context)

output_dir: results
pass_threshold: 0.5

test_suite:
  # ---- TEST 1: size_from_preview ----
  # Given a list rendered with "... N items not shown ..." pprint truncation,
  # can the model compute the total item count from the visible head/tail + count?

  - name: truncation_size_before
    description: "Count items in a list with pprint's '... N items not shown ...' marker (no wrapper)"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_size_before.jsonl
    scorers:
      - name: exact_match
        class: ExactMatchScorer
        weight: 1.0

  - name: truncation_size_after
    description: "Count items in a list rendered with <preview>...</preview> wrapper"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_size_after.jsonl
    scorers:
      - name: exact_match
        class: ExactMatchScorer
        weight: 1.0

  # ---- TEST 2: error_in_truncated_head ----
  # Given a captured stream where the L2 head/tail block contains the answer,
  # can the model find the relevant line inside the <truncated[-output]> wrapper?

  - name: truncation_error_before
    description: "Find error message inside <truncated-output> head (today's marker name)"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_error_before.jsonl
    scorers:
      - name: substring_match
        class: LLMJudgeScorer
        weight: 1.0
        model: nemotron3-nano-30b
        rubric: |
          Does the answer mention or contain the expected phrase?

          Answer: {output}
          Expected phrase: {expected}

          Pass=true if the expected phrase appears verbatim or is clearly the
          core of the answer (e.g., "connection refused at db:5432" passes for
          expected "connection refused"). Pass=false if the answer says
          UNKNOWN, gives a different error, or hallucinates content not present
          in the input.

  - name: truncation_error_after
    description: "Find error message inside <truncated> head (3.0 marker name)"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_error_after.jsonl
    scorers:
      - name: substring_match
        class: LLMJudgeScorer
        weight: 1.0
        model: nemotron3-nano-30b
        rubric: |
          Does the answer mention or contain the expected phrase?

          Answer: {output}
          Expected phrase: {expected}

          Pass=true if the expected phrase appears verbatim or is clearly the
          core of the answer. Pass=false if the answer says UNKNOWN, gives a
          different error, or hallucinates content not present in the input.

  # ---- TEST 3: partial_data_acknowledged ----
  # Given a partial container where the answer would be in the elided middle,
  # the model must say UNKNOWN (not hallucinate). Tests "recognize partial".

  - name: truncation_partial_before
    description: "Refuse to answer when target data is in the elided middle (no wrapper)"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_partial_before.jsonl
    scorers:
